name: Deploy Food Ordering App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: food-ordering-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Package application
        run: zip -r ../food-ordering-app.zip server.js package.json package-lock.json public

            - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
          aws-region: ap-south-1
          application-name: food-ordering-app
          environment-name: Food-ordering-app-env
          create-environment-if-not-exists: false
          deployment-package-path: food-ordering-app.zip